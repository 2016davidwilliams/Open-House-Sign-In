<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="shell"><nav class="nav"><div class="brand">QR CODE</div><a href="dashboard.html">Owner dashboard</a></nav><main class="card"><span class="eyebrow">Campaign link</span><h1>Create the guest QR code</h1><p>Paste the final GitHub Pages form URL. A source label lets the dashboard distinguish open houses or events.</p><div class="grid"><div class="full"><label for="url">Published form URL</label><input id="url" type="url" placeholder="https://username.github.io/repository/"></div><div><label for="source">Source label</label><input id="source" value="open-house"></div><div class="toolbar"><button id="make" class="btn">Generate QR code</button><button id="save" class="btn alt" disabled>Download PNG</button></div><div id="qr" class="full"></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>const q=s=>document.querySelector(s);q('#make').onclick=async()=>{let u=q('#url').value.trim();if(!u)return;const url=new URL(u);url.searchParams.set('source',q('#source').value.trim()||'qr');q('#qr').innerHTML='';const canvas=document.createElement('canvas');q('#qr').appendChild(canvas);await QRCode.toCanvas(canvas,url.toString(),{width:700,margin:3,color:{dark:'#17243c',light:'#ffffff'}});q('#save').disabled=false};q('#save').onclick=()=>{const a=document.createElement('a');a.download='lead-form-qr.png';a.href=q('#qr canvas').toDataURL('image/png');a.click()};</script></body></html>
