<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Secure real estate lead and open house registration form"><title>Open House Connect</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="shell"><nav class="nav"><div class="brand">OPEN HOUSE CONNECT</div><div class="nav-links"><a href="index.html">Guest form</a><a href="dashboard.html">Owner dashboard</a></div></nav><main class="card"><section class="hero"><span class="eyebrow">Welcome</span><h1>Let’s find the right next step.</h1><p>Please share a few details so we can understand your real estate needs and follow up appropriately.</p></section><form id="leadForm" class="grid" autocomplete="on"><div><label for="fullName">Full name <span class="req">*</span></label><input id="fullName" name="name" required maxlength="120" autocomplete="name"></div><div><label for="address">Address</label><input id="address" name="address" maxlength="250" autocomplete="street-address"></div><div><label for="email">Email</label><input id="email" name="email" type="email" maxlength="180" autocomplete="email"></div><div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" maxlength="40" autocomplete="tel"></div><div class="full"><label>Are you currently working with an agent?</label><div class="choices"><label class="choice"><input type="radio" name="agent" value="Yes"> Yes</label><label class="choice"><input type="radio" name="agent" value="No"> No</label></div></div><div class="full"><label>What best describes your current needs?</label><div class="choices"><label class="choice"><input type="checkbox" name="needs" value="Looking to buy now"> Looking to buy now</label><label class="choice"><input type="checkbox" name="needs" value="Just browsing"> Just browsing</label><label class="choice"><input type="checkbox" name="needs" value="Plan to buy within a year"> Plan to buy within a year</label><label class="choice"><input type="checkbox" name="needs" value="Interested in selling"> Interested in selling</label></div></div><div class="full"><label for="notes">Anything else we should know?</label><textarea id="notes" maxlength="1500" placeholder="Preferred areas, timing, price range, or questions"></textarea></div><div class="hidden"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div><div class="full"><label class="choice"><input id="consent" type="checkbox" required> I agree that the real estate professional hosting this form may contact me about my inquiry.</label><p class="fine">Do not include sensitive financial information in this form.</p></div><div class="full"><button class="btn" id="submitBtn" type="submit">Submit information</button><div id="status" role="status" aria-live="polite" class="status"></div></div></form></main><footer class="footer">Private real estate lead capture site</footer></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/app.js"></script></body></html>
