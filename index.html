<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandy Williams Realty</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="hero">
    <div class="overlay">

        <div class="form-card">

            <h1>Brandy Williams Realty</h1>

            <p class="subtitle">
                Welcome! Please sign in so we can follow up regarding your real estate interests and provide additional property information.
            </p>

            <form>

                <input type="text" placeholder="Full Name" required>

                <input type="text" placeholder="Address">

                <input type="email" placeholder="Email Address">

                <input type="tel" placeholder="Phone Number">

                <h3>Are you currently working with an agent?</h3>

                <label>
                    <input type="radio" name="agent">
                    Yes
                </label>

                <label>
                    <input type="radio" name="agent">
                    No
                </label>

                <h3>What best describes your current needs?</h3>

                <label>
                    <input type="checkbox">
                    Looking to buy now
                </label>

                <label>
                    <input type="checkbox">
                    Just browsing
                </label>

                <label>
                    <input type="checkbox">
                    Plan to buy within a year
                </label>

                <label>
                    <input type="checkbox">
                    Interested in selling
                </label>

                <textarea placeholder="Tell us a little about your real estate needs..."></textarea>

                <button type="submit">
                    Submit Information
                </button>

            </form>

        </div>

    </div>
</div>

</body>
</html>
