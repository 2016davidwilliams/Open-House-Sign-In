<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Dashboard</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="shell"><nav class="nav"><div class="brand">LEAD DASHBOARD</div><div class="nav-links"><a href="index.html">Guest form</a><a href="qr.html">QR code</a></div></nav><main class="card"><section id="login"><span class="eyebrow">Private access</span><h1>Owner sign in</h1><p>Enter an authorized email address. Supabase will send a secure sign-in link.</p><div class="toolbar"><input id="loginEmail" type="email" placeholder="you@example.com" style="max-width:360px"><button id="loginBtn" class="btn">Email sign-in link</button></div><div id="loginStatus" class="status"></div></section><section id="app" class="hidden"><div class="toolbar"><button id="refreshBtn" class="btn">Refresh</button><button id="exportBtn" class="btn alt">Export CSV</button><button id="logoutBtn" class="btn">Sign out</button></div><div class="stats"><div class="stat"><span>Total leads</span><strong id="total">0</strong></div><div class="stat"><span>Buy now</span><strong id="buyNow">0</strong></div><div class="stat"><span>Selling</span><strong id="selling">0</strong></div><div class="stat"><span>New, 7 days</span><strong id="recent">0</strong></div></div><div class="table-wrap"><table><thead><tr><th>Submitted</th><th>Name</th><th>Contact</th><th>Agent?</th><th>Needs</th><th>Notes</th></tr></thead><tbody id="leadRows"></tbody></table></div><div id="dashStatus" class="status"></div></section></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/dashboard.js"></script></body></html>
